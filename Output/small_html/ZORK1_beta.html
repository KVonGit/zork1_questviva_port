<div id="qv-start" class="qv-chrome">

                Quest Viva

        </div>

        <div id="qv-error" class="hidden card preset-tonal-error p-4 text-sm"></div>

            <div class="flex items-center gap-3 text-surface-500 text-xs">

                <hr class="hr flex-1">

            <div>
                <label class="label-text text-xs uppercase tracking-wide text-surface-500" for="qv-url-input">Load from URL</label>

</div>

    <div class="card preset-filled-surface-100-900 w-full p-6 space-y-4" data-theme="wintry">
        <div class="flex items-start justify-between gap-4">
            <h2 class="h3" id="qv-saves-heading-boot" data-mode-text="boot" data-chrome-key="ContinueYourGamePrompt">Continue your game?</h2>
            <h2 class="h3 qv-manage-only" id="qv-saves-heading-manage" data-mode-text="manage" data-chrome-key="SaveLoadTitle">Save / Load</h2>
            <button id="qv-saves-close" type="button" class="qv-manage-only btn-icon preset-tonal-surface" aria-label="Close" data-chrome-key-aria-label="CloseDialog">
                <svg class="qv-icon" aria-hidden="true"><use href="#x"></use></svg>
            </button>
        </div>

        <div id="qv-saves-error" class="hidden card preset-tonal-error p-3 text-sm"></div>

        <button id="qv-saves-start-new" type="button" class="btn preset-tonal-primary w-full justify-start" data-chrome-key="StartFromBeginning">
            Start from the beginning
        </button>

        <ul id="qv-saves-list" class="space-y-2"></ul>

        <div class="qv-manage-only space-y-3">
            <hr class="hr">
            <div class="flex gap-2">
                <input id="qv-saves-name-input" class="input" type="text" placeholder="Save name" aria-label="Save name" autocomplete="off" data-chrome-key-placeholder="SaveNamePlaceholder" data-chrome-key-aria-label="SaveNamePlaceholder">
                <button id="qv-saves-save-new" type="button" class="btn preset-filled-primary-500" data-chrome-key="SaveNew">Save new</button>
            </div>
            <div class="flex gap-2">
                <button id="qv-saves-download" type="button" class="btn preset-tonal-primary flex-1" data-chrome-key="SaveToFile">Save to file</button>
                <button id="qv-saves-upload-btn" type="button" class="btn preset-tonal-primary flex-1" data-chrome-key="LoadFromFile">Load from file</button>
                <input type="file" id="qv-saves-file-input" class="hidden" accept=".quest-save">
            </div>
        </div>
    </div>
</dialog>

<dialog id="questVivaDebugger" class="qv-chrome" aria-labelledby="qv-debugger-heading">
    <div class="card preset-filled-surface-100-900 p-6 flex flex-col h-full" id="qv-debugger-card" data-theme="wintry">
        <div id="qv-debugger-titlebar" class="flex items-start justify-between gap-4 mb-4">
            <h2 class="h3" id="qv-debugger-heading">Debugger</h2>
            <button id="qv-debugger-close" type="button" class="btn-icon preset-tonal-surface" aria-label="Close">
                <svg class="qv-icon" aria-hidden="true"><use href="#x"></use></svg>
            </button>
        </div>

        <div id="qv-debugger-tabs" class="flex flex-wrap gap-2 mb-4"></div>

        <div class="flex flex-1" id="qv-debugger-panes" style="min-height:0">
            <div id="qv-debugger-list" class="shrink-0">
                <button type="button" id="qv-debugger-list-sort"><span class="qv-debugger-sort-label">Name</span></button>
                <ul id="qv-debugger-list-items" class="space-y-1"></ul>
            </div>
            <div id="qv-debugger-splitter" role="separator" aria-orientation="vertical" aria-label="Resize object list"></div>
            <div id="qv-debugger-detail" class="flex-1 overflow-y-auto text-sm">
                <p class="text-surface-500">Select an item to view details.</p>
            </div>
        </div>

        <div id="qv-debugger-resize-handle" aria-hidden="true"></div>
    </div>
</dialog>
